
{{- $name := .Get "name" | default "window" | markdownify}}
{{- $ico := .Get "icon" | default "X" | markdownify}}
{{- $class := .Get "class" | default ""}}

<div class="window, {{ $class }}">
    <div class="window_upper">
        <div>
        {{$name}}
        </div>
        <div>
        {{$ico}}
        </div>
    </div>
    <div class="window_lower">
          {{ .Inner | markdownify }}
    </div>
</div>
